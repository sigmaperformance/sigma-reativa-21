<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Avaliação Sigma Mulher 35+</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #FBEAF0 !important;
    color: #2C2C2A !important;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: #FFFFFF !important;
    border-radius: 20px;
    max-width: 520px;
    width: 100%;
    padding: 36px 28px;
    box-shadow: 0 8px 32px rgba(114, 36, 62, 0.12);
  }
  .brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #3C3489 !important;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .progress-wrap {
    height: 5px;
    background: #F1EFE8 !important;
    border-radius: 3px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 4%;
    background: #72243E !important;
    border-radius: 3px;
    transition: width 0.35s ease;
  }
  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: #993556 !important;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .qcount {
    font-size: 13px;
    color: #888780 !important;
    margin-bottom: 4px;
  }
  .qtext {
    font-size: 19px;
    font-weight: 700;
    color: #2C2C2A !important;
    line-height: 1.4;
    margin-bottom: 22px;
  }
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: #FFFFFF !important;
    border: 1.5px solid #D3D1C7 !important;
    border-radius: 12px;
    color: #2C2C2A !important;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .opt-btn:hover {
    border-color: #72243E !important;
    background: #FBEAF0 !important;
  }
  .opt-btn:active { transform: scale(0.99); }
  textarea, input[type=text] {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #D3D1C7 !important;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    color: #2C2C2A !important;
    background: #FFFFFF !important;
    resize: vertical;
    min-height: 90px;
    margin-bottom: 14px;
  }
  textarea:focus, input[type=text]:focus {
    outline: none;
    border-color: #72243E !important;
  }
  .next-btn {
    display: inline-block;
    background: #72243E !important;
    color: #FFFFFF !important;
    border: none;
    border-radius: 12px;
    padding: 13px 26px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .next-btn:hover { background: #5a1c32 !important; }
  .skip-link {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    color: #888780 !important;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }
  .intro-title {
    font-size: 24px;
    font-weight: 700;
    color: #72243E !important;
    line-height: 1.3;
    margin-bottom: 10px;
  }
  .intro-sub {
    font-size: 15px;
    color: #5F5E5A !important;
    line-height: 1.6;
    margin-bottom: 26px;
  }
  .version-card {
    border: 1.5px solid #D3D1C7 !important;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .version-card:hover {
    border-color: #3C3489 !important;
    background: #EEEDFE !important;
  }
  .version-title {
    font-size: 16px;
    font-weight: 700;
    color: #2C2C2A !important;
    margin-bottom: 4px;
  }
  .version-desc {
    font-size: 13px;
    color: #888780 !important;
    line-height: 1.5;
  }
  .result-title {
    font-size: 22px;
    font-weight: 700;
    color: #72243E !important;
    margin-bottom: 8px;
    text-align: center;
  }
  .result-sub {
    font-size: 14px;
    color: #5F5E5A !important;
    text-align: center;
    margin-bottom: 26px;
    line-height: 1.6;
  }
  .wa-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: #1DA851 !important;
    color: #FFFFFF !important;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
  }
  .wa-btn:hover { background: #178c44 !important; }
  .alert-box {
    background: #FAEEDA !important;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #633806 !important;
    margin-bottom: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card" id="app"></div>

      { id: 'c12', section: 'Comportamental', text: 'O que você mais gostaria de recuperar ou sentir de volta nos próximos meses?', open: true }

    var nutricionalQuestions = [
      { id: 'n1', section: 'Nutricional', text: 'Como são suas refeições num dia comum? Descreva café da manhã, almoço, jantar e lanches.', open: true },
      { id: 'n2', section: 'Nutricional', text: 'Você sente compulsão ou desejo forte por doces/carboidratos em algum momento do dia?',

    var mrsQuestions = [
      { id: 'mrs_intro', section: 'Sintomas do Climatério', text: 'Agora vamos passar por uma lista de sintomas comuns nessa fase. Para cada um, pense em como você tem se sentido ultimamente e escolha a intensidade que melhor descreve sua experiência.', isIntro: true },
      { id: 'mrs1', section: 'Sintomas do Climatério', text: 'Ondas de calor, sudorese (episódios de sudorese)', mrsScale: true },
      { id: 'mrs2', section: 'Sintomas do Climatério', text: 'Desconforto cardíaco (consciência invulgar do batimento cardíaco, coração aos saltos, acelerado, aperto)', mrsScale: true },
      { id: 'mrs3', section: 'Sintomas do Climatério', text: 'Problemas de sono (dificuldade em adormecer, dificuldade em dormir durante a noite, acordar cedo)', mrsScale: true },
      { id: 'mrs4', section: 'Sintomas do Climatério', text: 'Humor depressivo (estar em baixo, triste, com vontade de chorar, falta de motivação, alterações de humor)', mrsScale: true },
      { id: 'mrs5', section: 'Sintomas do Climatério', text: 'Irritabilidade (sensação de nervosismo, tensão interior, sentir-se agressiva)', mrsScale: true },
      { id: 'mrs6', section: 'Sintomas do Climatério', text: 'Ansiedade (inquietação interior, sensação de pânico)', mrsScale: true },
      { id: 'mrs7', section: 'Sintomas do Climatério', text: 'Exaustão física e mental (diminuição geral do desempenho, memória prejudicada, diminuição da concentração, esquecimento)', mrsScale: true },

      { id: 'mrs10', section: 'Sintomas do Climatério', text: 'Secura da vagina (sensação de secura ou ardor na vagina, dificuldade nas relações sexuais)', mrsScale: true },

    var iciqQuestions = [
      { id: 'iciq_intro', section: 'Saúde Urinária', text: 'Muitas mulheres têm, por vezes, perdas de urina. Vamos te perguntar um pouco sobre isso — pensando no que você sentiu, em média, nas últimas 4 semanas.', isIntro: true },
      { id: 'iciq1', section: 'Saúde Urinária', text: 'Com que frequência você tem perdas de urina?',
        options: [
          { label: 'Nunca', value: 0 },
          { label: 'Uma vez por semana ou menos', value: 1 },
          { label: '2 a 3 vezes por semana', value: 2 },
          { label: 'Uma vez ao dia', value: 3 },
          { label: 'Várias vezes ao dia', value: 4 },
          { label: 'O tempo todo', value: 5 }
        ]},
      { id: 'iciq2', section: 'Saúde Urinária', text: 'Que quantidade de urina você costuma perder (use ou não proteção)?',
        options: [
          { label: 'Nenhuma', value: 0 },
          { label: 'Uma pequena quantidade', value: 2 },
          { label: 'Uma quantidade moderada', value: 4 },
          { label: 'Uma grande quantidade', value: 6 }
        ]},
      { id: 'iciq3', section: 'Saúde Urinária', text: 'Em uma escala de 0 a 10, o quanto a perda de urina interfere na sua vida diária?', scale10: true },
      { id: 'iciq4', section: 'Saúde Urinária', text: 'Quando você tem perdas de urina? (pode escolher mais de uma)',
        multiOptions: ['Nunca', 'Antes de chegar ao banheiro', 'Ao tossir ou espirrar', 'Enquanto dorme', 'Ao fazer esforço físico/exercício', 'Quando termina de urinar e já está vestida', 'Sem razão óbvia', 'O tempo todo'] }
    ];

    var fraxQuestions = [
      { id: 'frax_intro', section: 'Saúde Óssea', text: 'Agora algumas perguntas sobre saúde óssea — elas ajudam a entender se vale a pena investigar mais a fundo sua densidade óssea.', isIntro: true },
      { id: 'frax1', section: 'Saúde Óssea', text: 'Você já teve alguma fratura após os 40 anos, sem um trauma grave (ex: caiu de pequena altura e quebrou um osso)?',
        options: [ { label: 'Sim', value: true }, { label: 'Não', value: false } ] },
      { id: 'frax2', section: 'Saúde Óssea', text: 'Algum dos seus pais já fraturou o quadril?',
        options: [ { label: 'Sim', value: true }, { label: 'Não', value: false }, { label: 'Não sei', value: 'Não sei' } ] },
      { id: 'frax3', section: 'Saúde Óssea', text: 'Você fuma atualmente?',
        options: [ { label: 'Sim', value: true }, { label: 'Não', value: false } ] },
      { id: 'frax4', section: 'Saúde Óssea', text: 'Você já usou ou usa corticoide oral por mais de 3 meses seguidos (ex: prednisona)?',
        options: [ { label: 'Sim', value: true }, { label: 'Não', value: false } ] },
      { id: 'frax5', section: 'Saúde Óssea', text: 'Você tem diagnóstico de artrite reumatoide?',
        options: [ { label: 'Sim', value: true }, { label: 'Não', value: false } ] },
      { id: 'frax6', section: 'Saúde Óssea', text: 'Você consome 3 ou mais doses de álcool por dia, na maioria dos dias?',
        options: [ { label: 'Sim', value: true }, { label: 'Não', value: false } ] },
      { id: 'frax7', section: 'Saúde Óssea', text: 'Você já teve diagnóstico de osteopenia ou osteoporose, ou já fez densitometria óssea?',

    ];

    var fsfiQuestions = [
      { id: 'fsfi_intro', section: 'Função Sexual', text: 'Você mencionou que a sexualidade tem sido uma área de desconforto. Queremos entender isso com mais profundidade — essa parte é mais detalhada, mas vai ajudar bastante na sua avaliação.', isIntro: true,
        showIf: function(a){ return typeof a.mrs8 === 'number' && a.mrs8 >= 2; } },
      { id: 'fsfi1', section: 'Função Sexual', text: 'Nas últimas 4 semanas, com que frequência você sentiu desejo ou interesse sexual?',
        options: [ { label: 'Quase sempre ou sempre', value: 5 }, { label: 'Na maioria das vezes (mais da metade)', value: 4 }, { label: 'Às vezes (cerca da metade)', value: 3 }, { label: 'Poucas vezes (menos da metade)', value: 2 }, { label: 'Quase nunca ou nunca', value: 1 } ],
        showIf: function(a){ return typeof a.mrs8 === 'number' && a.mrs8 >= 2; } },

      { id: 'fsfi4', section: 'Função Sexual', text: 'Nas últimas 4 semanas, com que frequência você atingiu o orgasmo quando havia estimulação sexual?',

        showIf: function(a){ return typeof a.mrs8 === 'number' && a.mrs8 >= 2; } },
      { id: 'fsfi5', section: 'Função Sexual', text: 'Nas últimas 4 semanas, qual foi o seu nível de satisfação com sua vida sexual de forma geral?',

  var MRS_LABELS = ['Nenhum', 'Ligeiro', 'Moderado', 'Acentuado', 'Extremamente acentuado'];
  var MRS_QUESTION_LABELS = {
    mrs1: 'Ondas de calor/sudorese', mrs2: 'Desconforto cardíaco', mrs3: 'Problemas de sono',
    mrs4: 'Humor depressivo', mrs5: 'Irritabilidade', mrs6: 'Ansiedade', mrs7: 'Exaustão física e mental',

    somatovegetativo: ['mrs1', 'mrs2', 'mrs3', 'mrs11'],
    psicologico: ['mrs4', 'mrs5', 'mrs6', 'mrs7'],
    urogenital: ['mrs8', 'mrs9', 'mrs10']
  };

  function computeICIQ() {
    var freq = typeof answers.iciq1 === 'number' ? answers.iciq1 : 0;
    var qtd = typeof answers.iciq2 === 'number' ? answers.iciq2 : 0;
    var impacto = typeof answers.iciq3 === 'number' ? answers.iciq3 : 0;
    return freq + qtd + impacto;
  }

  function computeFRAXRisco() {
    var fatores = [];
    if (answers.frax1 === true) fatores.push('Fratura prévia de fragilidade após os 40 anos');
    if (answers.frax2 === true) fatores.push('História familiar de fratura de quadril');
    if (answers.frax3 === true) fatores.push('Tabagismo atual');
    if (answers.frax4 === true) fatores.push('Uso prolongado de corticoide oral');
    if (answers.frax5 === true) fatores.push('Artrite reumatoide');
    if (answers.frax6 === true) fatores.push('Consumo elevado de álcool');
    return fatores;
  }

  function computeFSFI() {
    if (!(typeof answers.mrs8 === 'number' && answers.mrs8 >= 2)) return null;
    var desejo = (answers.fsfi1 || 0) + (answers.fsfi2 || 0);
    var excitacaoLub = (answers.fsfi3 || 0);
    var orgasmo = (answers.fsfi4 || 0);
    var satisfacao = (answers.fsfi5 || 0);
    var dor = (answers.fsfi6 || 0);
    return { desejo: desejo, lubrificacao: excitacaoLub, orgasmo: orgasmo, satisfacao: satisfacao, dor: dor };
  }

  function computeMRS() {
    function soma(ids) {
      return ids.reduce(function(acc, id) { return acc + (typeof answers[id] === 'number' ? answers[id] : 0); }, 0);
    }
    var somato = soma(MRS_DOMINIOS.somatovegetativo);
    var psico = soma(MRS_DOMINIOS.psicologico);
    var uro = soma(MRS_DOMINIOS.urogenital);
    return { somato: somato, psico: psico, uro: uro, total: somato + psico + uro };
  }

  function computeNivelScore() {
    return (answers.p1 || 0) + (answers.p2 || 0) + (answers.p3 || 0);
  }

  function computeNivel() {
    var score = computeNivelScore();
    if (score <= 3) return 'Sigma Base';
    if (score <= 6.5) return 'Sigma Avança';
    return 'Sigma Performance';
  }

  var NIVEL_PERFIS = {
    'Sigma Base': {
      desc: 'Iniciante ou retomando treino de força após pausa longa. Foco inicial em padrão motor, construção de tendão/ligamento e conexão mente-músculo antes de progressão de carga.',
      justificativa: function(a) {
        var motivos = [];
        if ((a.p1 || 0) <= 1) motivos.push('pouca ou nenhuma experiência recente com treino de força');
        if ((a.p2 || 0) <= 1.5) motivos.push('insegurança ou desconhecimento dos movimentos compostos (agachamento, deadlift, remada)');
        if ((a.p3 || 0) <= 1.5) motivos.push('disposição física relatada como baixa ou moderada no dia a dia');
        return motivos.length ? motivos.join('; ') : 'pontuação geral baixa nos três critérios de nível';
      }
    },
    'Sigma Avança': {
      desc: 'Já tem base de treino consistente (12+ meses) e conforto com padrões compostos. Pronta para maior variedade de método (tri-sets, super-sets, pirâmides) e introdução de trabalho metabólico mais intenso (SIT).',
      justificativa: function(a) {
        var motivos = [];
        if ((a.p1 || 0) === 2) motivos.push('treina esporadicamente, com alguma experiência prévia');
        if ((a.p1 || 0) === 3) motivos.push('treina regularmente há mais de 6 meses');
        if ((a.p2 || 0) === 1.5) motivos.push('conhece os movimentos compostos mas ainda tem insegurança na execução');
        if ((a.p3 || 0) === 1.5) motivos.push('disposição física moderada — aguenta o dia mas sem sobra de energia');
        return motivos.length ? motivos.join('; ') : 'pontuação intermediária nos três critérios de nível';
      }
    },
    'Sigma Performance': {
      desc: '2+ anos de treino consistente, domina execução bilateral e unilateral, já trabalha com carga pesada. Pronta para maior frequência por grupo muscular, divisão superior/inferior e métodos de pico de carga (wave loading, 5x5).',
      justificativa: function(a) {
        var motivos = [];
        if ((a.p1 || 0) === 3) motivos.push('treina regularmente há mais de 6 meses');
        if ((a.p2 || 0) === 3) motivos.push('movimentos compostos já fazem parte da rotina, sem insegurança');
        if ((a.p3 || 0) === 3) motivos.push('boa disposição física relatada na maioria dos dias');
        return motivos.length ? motivos.join('; ') : 'pontuação alta nos três critérios de nível';
      }
    }
  };

  function buildAlertas() {
    var alertas = [];
    var nivel = computeNivel();
    var energia = answers.c1;
    var humor = answers.c11;
    var rotina = answers.c3;

    if ((nivel === 'Sigma Avança' || nivel === 'Sigma Performance')) {
      if (typeof energia === 'number' && energia <= 4) {
        alertas.push('Nível físico indica ' + nivel + ', mas energia geral reportada no comportamental é baixa (' + energia + '/10). Vale validar disposição real antes de aplicar volume cheio do nível.');
      }
      if (typeof humor === 'number' && humor <= 4) {
        alertas.push('Nível físico indica ' + nivel + ', mas humor geral reportado é baixo (' + humor + '/10). Considerar que fator comportamental pode estar limitando capacidade de execução, não só condicionamento.');
      }
    }

    if (nivel === 'Sigma Base' && typeof energia === 'number' && energia >= 8 && typeof rotina === 'number' && rotina >= 8) {
      alertas.push('Nível físico indica Sigma Base, mas energia e controle de rotina reportados são altos. Pode haver espaço para progressão mais rápida entre blocos, a critério clínico.');
    }

    if (answers.p5 === true) {
      alertas.push('ATENÇÃO: cliente sinalizou lesão/restrição física. Revisão manual obrigatória antes de liberar qualquer protocolo automático.');
    }

    if (typeof answers.c9 === 'number' && answers.c9 <= 4) {
      alertas.push('Cliente reporta baixa identificação com "ser a mesma de antes" (' + answers.c9 + '/10) — sinal de carga emocional relevante para o Pilar 3, vale atenção da Jéssica na devolutiva.');
    }

    return alertas;
  }

  function buildMessage() {
    var lines = [];
    var nivel = computeNivel();
    var perfil = NIVEL_PERFIS[nivel];
    var score = computeNivelScore();

    lines.push('*Avaliação Sigma Mulher 35+*');
    lines.push('');
    lines.push('*— PERFIL DE TREINO —*');
    lines.push('Nível calculado: ' + nivel + ' (pontuação ' + score + '/9)');
    lines.push('O que esse nível significa: ' + perfil.desc);
    lines.push('Por que ela caiu nesse nível: ' + perfil.justificativa(answers));
    lines.push('Local de treino: ' + (answers.p4 === 'academia' ? 'Academia' : 'Casa'));
    lines.push('Dias por semana: ' + (answers.p6 || '-'));
    lines.push('Lesão/restrição: ' + (answers.p5 === true ? 'Sim — ' + (answers.p5b || '(sem detalhe)') : 'Não'));

    var alertas = buildAlertas();
    if (alertas.length) {
      lines.push('');
      lines.push('*— PONTOS DE ATENÇÃO (cruzamento automático) —*');
      alertas.forEach(function(al) { lines.push('• ' + al); });
    }
    lines.push('');
    lines.push('*— COMPORTAMENTAL (Jéssica) —*');
    lines.push('Energia (1-10): ' + (answers.c1 || '-'));
    lines.push('Sono: ' + (answers.c2 || '-'));
    lines.push('Controle da rotina (1-10): ' + (answers.c3 || '-'));
    lines.push('O que consome energia: ' + (answers.c4 || '-'));
    lines.push('Controle da alimentação (1-10): ' + (answers.c5 || '-'));
    lines.push('Momento de vontade de comer fora do planejado: ' + (answers.c6 || '-'));
    lines.push('Já fez dieta restritiva: ' + (answers.c7 || '-') + (answers.c8 ? ' — ' + answers.c8 : ''));
    lines.push('Sente-se "a mesma de antes" (1-10): ' + (answers.c9 || '-'));
    lines.push('O que era fácil e hoje é diferente: ' + (answers.c10 || '-'));
    lines.push('Humor geral (1-10): ' + (answers.c11 || '-'));
    lines.push('O que quer recuperar: ' + (answers.c12 || '-'));
    lines.push('');
    lines.push('*— NUTRICIONAL —*');
    lines.push('Refeições num dia comum: ' + (answers.n1 || '-'));
    lines.push('Compulsão por doces/carbo: ' + (answers.n2 || '-') + (answers.n2b ? ' — ' + answers.n2b : ''));
    lines.push('Álcool por semana: ' + (answers.n3 || '-'));
    lines.push('Dieta restritiva prévia: ' + (answers.n4 || '-'));
    lines.push('Restrição/condição diagnosticada: ' + (answers.n5 || '-'));
    lines.push('Relação com fome/saciedade: ' + (answers.n6 || '-'));

    var mrs = computeMRS();
    lines.push('');
    lines.push('*— SINTOMAS DO CLIMATÉRIO (MRS) —*');
    lines.push('Escala validada (Menopause Rating Scale)');
    lines.push('Escore total: ' + mrs.total + '/44');
    lines.push('Somatovegetativo (calor, sono, cardíaco, articular): ' + mrs.somato + '/16');
    lines.push('Psicológico (humor, irritabilidade, ansiedade, exaustão): ' + mrs.psico + '/16');
    lines.push('Urogenital (sexual, bexiga, secura vaginal): ' + mrs.uro + '/12');
    var itensRelevantes = [];
    ['mrs1','mrs2','mrs3','mrs4','mrs5','mrs6','mrs7','mrs8','mrs9','mrs10','mrs11'].forEach(function(id){
      if (typeof answers[id] === 'number' && answers[id] >= 3) {
        var q = MRS_QUESTION_LABELS[id];
        itensRelevantes.push(q + ' (' + MRS_LABELS[answers[id]] + ')');
      }
    });
    if (itensRelevantes.length) {
      lines.push('Itens com intensidade acentuada ou maior: ' + itensRelevantes.join('; '));
    }

    lines.push('');
    lines.push('*— SAÚDE URINÁRIA (ICIQ-SF) —*');
    lines.push('Escala validada (ICIQ-SF)');
    lines.push('Escore: ' + computeICIQ() + '/21');
    lines.push('Quando ocorrem as perdas: ' + (answers.iciq4 || '-'));

    lines.push('');
    lines.push('*— SAÚDE ÓSSEA (triagem de risco) —*');
    var fatoresRisco = computeFRAXRisco();
    if (fatoresRisco.length) {
      lines.push('Fatores de risco presentes: ' + fatoresRisco.join('; '));
      lines.push('Sugestão: considerar cálculo formal de risco (FRAX) e avaliar indicação de densitometria.');
    } else {
      lines.push('Nenhum fator de risco clínico sinalizado nesta triagem.');
    }
    lines.push('Histórico de densitometria/diagnóstico: ' + (answers.frax7 === 'diagnostico' ? 'Já tem diagnóstico de osteopenia/osteoporose' : answers.frax7 === 'exame_normal' ? 'Já fez exame, sem alteração' : 'Nunca fez densitometria'));

    var fsfi = computeFSFI();
    if (fsfi) {
      lines.push('');
      lines.push('*— FUNÇÃO SEXUAL (FSFI, aprofundado) —*');
      lines.push('Disparado por sinalização de problemas sexuais na MRS');
      lines.push('Desejo: ' + fsfi.desejo + '/10');
      lines.push('Lubrificação: ' + fsfi.lubrificacao + '/5');
      lines.push('Orgasmo: ' + fsfi.orgasmo + '/5');
      lines.push('Satisfação: ' + fsfi.satisfacao + '/5');
      lines.push('Dor (maior = menos dor): ' + fsfi.dor + '/5');
    }

    return lines.join('\n');
  }

  function render() {
    var app = document.getElementById('app');
    if (screenIndex === -1) { renderIntro(app); return; }
    screens = buildScreens();
    var visible = screens.filter(function(q){ return !q.showIf || q.showIf(answers); });
    if (screenIndex >= visible.length) { renderResult(app); return; }
    renderQuestion(app, visible[screenIndex], visible.length);
  }

  function renderIntro(app) {
    var html = '';
    html += '<div class="brand">Sigma Performance</div>';
    html += '<div class="intro-title">Avaliação Sigma Mulher 35+</div>';
    html += '<div class="intro-sub">Vamos te conhecer melhor para montar seu protocolo — treino, comportamento e alimentação. São poucas perguntas, em poucos minutos, e ao final tudo é enviado direto para a nossa equipe pelo WhatsApp.</div>';
    html += '<button class="next-btn" id="start-btn" style="width:100%; text-align:center;">Começar avaliação</button>';
    app.innerHTML = html;
    document.getElementById('start-btn').addEventListener('click', function(){ screenIndex = 0; render(); });
  }

  function renderQuestion(app, q, total) {
    var pct = Math.round(((screenIndex + 1) / total) * 96) + 4;
    var html = '<div class="progress-wrap"><div class="progress-bar" style="width:' + Math.min(pct,100) + '%"></div></div>';
    html += '<div class="section-label">' + q.section + '</div>';
    html += '<div class="qcount">Pergunta ' + (screenIndex + 1) + ' de ' + total + '</div>';
    html += '<div class="qtext">' + q.text + '</div>';

    if (q.isIntro) {
      html += '<button class="next-btn" id="intro-next-btn" style="width:100%; text-align:center;">Continuar</button>';
      app.innerHTML = html;
      document.getElementById('intro-next-btn').addEventListener('click', function() {
        screenIndex++;
        render();
      });
      return;
    }

    if (q.mrsScale) {
      html += '<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:10px;">';
      MRS_LABELS.forEach(function(label, i) {
        html += '<button class="opt-btn mrs-opt-btn" data-val="' + i + '">' + label + '</button>';
      });
      html += '</div>';
      app.innerHTML = html;
      var mrsBtns = app.querySelectorAll('.mrs-opt-btn');
      mrsBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          answers[q.id] = parseInt(btn.getAttribute('data-val'));
          screenIndex++;
          render();
        });
      });
      return;
    }

    if (q.scale10) {
      html += '<div id="scale10-wrap" style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">';
      for (var s10 = 0; s10 <= 10; s10++) {
        html += '<button class="opt-btn" data-val="' + s10 + '" style="width:40px; text-align:center; padding:12px 0; margin-bottom:0;">' + s10 + '</button>';
      }
      html += '</div>';
      html += '<div style="display:flex; justify-content:space-between; font-size:12px; color:#888780; margin-bottom:10px;"><span>nada</span><span>bastante</span></div>';
      app.innerHTML = html;
      var s10Btns = app.querySelectorAll('#scale10-wrap .opt-btn');
      s10Btns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          answers[q.id] = parseInt(btn.getAttribute('data-val'));
          screenIndex++;
          render();
        });
      });
      return;
    }

    if (q.multiOptions) {
      html += '<div id="multi-wrap" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">';
      q.multiOptions.forEach(function(label, i) {
        html += '<button class="opt-btn multi-opt-btn" data-idx="' + i + '" data-selected="false">' + label + '</button>';
      });
      html += '</div>';
      html += '<button class="next-btn" id="multi-next-btn" style="width:100%; text-align:center;">Continuar</button>';
      app.innerHTML = html;
      var multiBtns = app.querySelectorAll('.multi-opt-btn');
      multiBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var selected = btn.getAttribute('data-selected') === 'true';
          btn.setAttribute('data-selected', selected ? 'false' : 'true');
          btn.style.borderColor = selected ? '' : '#72243E';
          btn.style.background = selected ? '' : '#FBEAF0';
        });
      });
      document.getElementById('multi-next-btn').addEventListener('click', function() {
        var selecionados = [];
        multiBtns.forEach(function(btn) {
          if (btn.getAttribute('data-selected') === 'true') {
            selecionados.push(q.multiOptions[parseInt(btn.getAttribute('data-idx'))]);
          }
        });
        answers[q.id] = selecionados.join(', ') || 'Nenhuma selecionada';
        screenIndex++;
        render();
      });
      return;
    }

    if (q.scale) {
      html += '<div id="scale-wrap" style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">';
      for (var i = 1; i <= 10; i++) {
        html += '<button class="opt-btn" data-val="' + i + '" style="width:44px; text-align:center; padding:12px 0; margin-bottom:0;">' + i + '</button>';
      }
      html += '</div>';
      html += '<div style="display:flex; justify-content:space-between; font-size:12px; color:#888780; margin-bottom:10px;"><span>muito baixo</span><span>muito alto</span></div>';
    } else if (q.open) {
      html += '<textarea id="open-input" placeholder="Escreva sua resposta aqui..."></textarea>';
      html += '<button class="next-btn" id="next-btn">Continuar</button>';
      if (!q.required) html += '<button class="skip-link" id="skip-btn">Pular esta pergunta</button>';
    } else {
      q.options.forEach(function(opt, i) {
        html += '<button class="opt-btn" data-idx="' + i + '">' + opt.label + '</button>';
      });
    }

    app.innerHTML = html;

    if (q.scale) {
      var btns = app.querySelectorAll('#scale-wrap .opt-btn');
      btns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          answers[q.id] = parseInt(btn.getAttribute('data-val'));
          screenIndex++;
          render();
        });
      });
    } else if (q.open) {
      document.getElementById('next-btn').addEventListener('click', function() {
        answers[q.id] = document.getElementById('open-input').value.trim();
        screenIndex++;
        render();
      });
      var skip = document.getElementById('skip-btn');
      if (skip) skip.addEventListener('click', function() {
        answers[q.id] = '';
        screenIndex++;
        render();
      });
    } else {
      var obtns = app.querySelectorAll('.opt-btn');
      obtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-idx'));
          answers[q.id] = q.options[idx].value;
          screenIndex++;
          render();
        });
      });
    }
  }

  function renderResult(app) {
    var msg = buildMessage();
    var waUrl = 'https://wa.me/' + SIGMA_WHATSAPP + '?text=' + encodeURIComponent(msg);
    var html = '';
    html += '<div class="progress-wrap"><div class="progress-bar" style="width:100%"></div></div>';
    html += '<div class="result-title">Tudo pronto!</div>';
    html += '<div class="result-sub">Suas respostas já estão organizadas. Toque no botão abaixo para enviar direto para o WhatsApp da equipe Sigma.</div>';
    html += '<div class="alert-box">O WhatsApp vai abrir com uma mensagem já preenchida. Você só precisa tocar em enviar.</div>';
    html += '<a class="wa-btn" id="wa-link" href="' + waUrl + '" target="_blank" rel="noopener">Enviar respostas pelo WhatsApp</a>';
    app.innerHTML = html;
  }

  render();
})();
</script>
